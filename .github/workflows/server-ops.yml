name: Server operations

# Run a fixed set of operations on the production server over the deploy key, without anyone
# needing a shell: check status, list Buffer channels, set the Buffer settings in .env, run
# the social planner once, check and configure the reel renderer, or render one match's reel. The Buffer API key comes from the production environment's
# BUFFER_API_KEY secret and is sent over SSH stdin, never printed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [status, buffer-channels, configure-buffer, plan-posts, reel-check, configure-reel, reel-render, configure-espn, espn-sync, reel-queue, configure-home]
        default: status
      channel_x:
        description: "configure-buffer: Buffer channel ID for X (blank = leave as is)"
        required: false
      channel_instagram:
        description: "configure-buffer: Buffer channel ID for Instagram (blank = leave as is)"
        required: false
      channel_tiktok:
        description: "configure-buffer: Buffer channel ID for TikTok (blank = leave as is)"
        required: false
      auto:
        description: "configure-buffer: switch automatic posting on or off"
        type: choice
        options: [unchanged, "true", "false"]
        default: unchanged
      slots:
        description: "configure-buffer: daily Lagos posting slots, e.g. 08:00,13:00,19:00 (blank = leave as is)"
        required: false
      reel_renderer:
        description: "configure-reel: where reels render (github needs the REEL_GITHUB_TOKEN secret)"
        type: choice
        options: [server, github, "off"]
        default: server
      reel_banter:
        description: "configure-reel: speech bubbles in reels"
        type: choice
        options: [unchanged, written, written+ai, "off"]
        default: unchanged
      reel_voiceover:
        description: "configure-reel: Kokoro voice-over for the bubbles"
        type: choice
        options: [unchanged, "on", "off"]
        default: unchanged
      reel_node:
        description: "configure-reel: absolute path to Node 18+ from reel-check (blank = leave as is)"
        required: false
      match_id:
        description: "reel-render: match ID to render now"
        required: false
      from_date:
        description: "reel-queue: first Lagos date, YYYY-MM-DD"
        required: false
      to_date:
        description: "reel-queue: last Lagos date, YYYY-MM-DD"
        required: false
      home_v2:
        description: "configure-home: the reels-first homepage"
        type: choice
        options: ["off", "on"]
        default: "off"
      espn_mode:
        description: "configure-espn: live (primary live source), shadow (compare only) or off"
        type: choice
        options: [live, shadow, "off"]
        default: live

permissions:
  contents: read

# Its own group: sharing the deploy group could let a queued ops run replace a pending deploy.
concurrency:
  group: matchday-server-ops

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # reel-check installs the renderer and headless Chrome; a reel render takes minutes.
    timeout-minutes: 40
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
      CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
      CPANEL_APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}
      CPANEL_PUBLIC_ROOT: ${{ secrets.CPANEL_PUBLIC_ROOT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
          BUFFER_API_KEY: ${{ inputs.action == 'configure-buffer' && secrets.BUFFER_API_KEY || '' }}
          INPUT_CHANNEL_X: ${{ inputs.channel_x }}
          INPUT_CHANNEL_INSTAGRAM: ${{ inputs.channel_instagram }}
          INPUT_CHANNEL_TIKTOK: ${{ inputs.channel_tiktok }}
          INPUT_AUTO: ${{ inputs.auto }}
          INPUT_SLOTS: ${{ inputs.slots }}
          REEL_GITHUB_TOKEN: ${{ inputs.action == 'configure-reel' && secrets.REEL_GITHUB_TOKEN || '' }}
          INPUT_REEL_RENDERER: ${{ inputs.reel_renderer }}
          INPUT_REEL_NODE: ${{ inputs.reel_node }}
          INPUT_REEL_BANTER: ${{ inputs.reel_banter }}
          INPUT_REEL_VOICEOVER: ${{ inputs.reel_voiceover }}
          INPUT_MATCH_ID: ${{ inputs.match_id }}
          INPUT_ESPN_MODE: ${{ inputs.espn_mode }}
          INPUT_HOME_V2: ${{ inputs.home_v2 }}
          INPUT_FROM: ${{ inputs.from_date }}
          INPUT_TO: ${{ inputs.to_date }}
        run: bash scripts/ci/deploy-ssh.sh "$ACTION"
