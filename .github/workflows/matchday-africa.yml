name: Matchday Africa CI/CD

on:
  pull_request:
    paths:
      - "matchday-africa/**"
      - ".github/workflows/matchday-africa.yml"
  push:
    branches: [main]
    paths:
      - "matchday-africa/**"
      - ".github/workflows/matchday-africa.yml"
  workflow_dispatch:

concurrency:
  group: matchday-africa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: matchday-africa

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the application
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: matchday-africa/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('matchday-africa/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Run application tests
        run: php artisan test

      - name: Build production assets
        run: npm run build

  deploy:
    name: Deploy to matchday.africa by FTP
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://matchday.africa

    steps:
      - name: Check out the application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: matchday-africa/package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build production assets
        run: npm ci && npm run build

      - name: Upload application to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ${{ secrets.CPANEL_FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          local-dir: ./matchday-africa/
          server-dir: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/**
            **/bootstrap/cache/**
            **/public/storage/**
            **/public/uploads/**
            **/*.log
            **/releases/**
