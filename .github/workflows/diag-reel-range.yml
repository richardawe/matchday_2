name: Diagnose reel playback
# Temporary, read-only: requests a public reel the way iOS Safari does. No secrets.
on:
  push:
    branches: [diag-reel-range]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find a reel URL on the live site
        run: |
          url=$(curl -sS https://matchday.africa/matches/4534 | grep -oE 'https://matchday\.africa/matches/[0-9]+/reel(\.mp4)?\?v=[^"]*' | head -1 | sed 's/&amp;/\&/g')
          echo "Reel on match page: $url"
          echo "URL=$url" >> "$GITHUB_ENV"
      - name: Range requests like Safari
        run: |
          ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for u in "$URL" "${URL/\/reel\?/\/reel.mp4?}"; do
            for r in "bytes=0-1" "bytes=0-" "bytes=1000-1999"; do
              echo "=== $u  Range: $r"
              curl -sS -o /dev/null -D - -A "$ua" -H "Range: $r" "$u" | tr -d '\r' | grep -iE '^HTTP|content-(type|length|range|encoding)|accept-ranges|transfer-encoding|cache|server|x-' || true
            done
          done
          echo "=== HEAD"
          curl -sS -I -A "$ua" "$URL" | tr -d '\r'
      - name: Compare static files and radio audio
        run: |
          ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          audio=$(curl -sS https://matchday.africa/listen/feed.xml | grep -oE 'https://matchday\.africa/listen/[0-9]+/audio[^"<]*' | head -1)
          gen=$(curl -sS https://matchday.africa/ | grep -oE '/generated/reels/[0-9]+/[^"]*\.mp4' | head -1)
          for u in https://matchday.africa/war/matchday-warriors-trailer.mp4 https://matchday.africa/images/logo.png ${gen:+https://matchday.africa$gen} "$audio"; do
            for enc in "" "gzip, deflate, br"; do
              echo "=== $u  Range: bytes=0-1  Accept-Encoding: ${enc:-none}"
              curl -sS -o /dev/null -D - -A "$ua" ${enc:+-H "Accept-Encoding: $enc"} -H "Range: bytes=0-1" "$u" | tr -d '\r' | grep -iE '^HTTP|content-(type|length|range|encoding)|transfer-encoding' || true
            done
          done
      - name: Inspect the video file
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          curl -sS -o reel.mp4 "$URL"
          ls -l reel.mp4
          ffprobe -v error -show_entries stream=codec_name,profile,level,pix_fmt,width,height,color_range:format=duration -of default=nw=1 reel.mp4
          python3 - <<'PY'
          d=open('reel.mp4','rb').read()
          i=d.find(b'moov'); j=d.find(b'mdat')
          print('moov at', i, 'mdat at', j, '->', 'faststart (moov first)' if 0<=i<j else 'moov AFTER mdat (not faststart)')
          PY
