name: Render match reel

# Fallback renderer for the Griot's 20-second reel (REEL_RENDERER=github). The site starts this
# with a signed props URL when a Premier League match finishes; the MP4 is uploaded by SSH to
# public/generated/reels/<match>/<match>.mp4, where the site's reel:render job picks it up.
on:
  workflow_dispatch:
    inputs:
      match_id: { description: Match ID, required: true, type: string }
      props_url: { description: Signed URL for the reel props, required: true, type: string }

concurrency:
  group: render-reel-${{ inputs.match_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    env:
      REEL_CONCURRENCY: "2"
    defaults:
      run:
        working-directory: matchday-africa/reel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: matchday-africa/reel/package-lock.json

      - name: Install Remotion
        run: npm ci --no-audit --no-fund

      - name: Render reel
        env:
          PROPS_URL: ${{ inputs.props_url }}
          MATCH_ID: ${{ inputs.match_id }}
        run: |
          case "$MATCH_ID" in (*[!0-9]*|'') echo "match_id must be numeric"; exit 1;; esac
          # shellcheck disable=SC2016
          node -e 'const u = new URL(process.env.PROPS_URL); if (u.origin !== "https://matchday.africa" || u.pathname !== `/reels/${process.env.MATCH_ID}/props`) process.exit(1);'
          mkdir -p out
          node render.mjs --props-url "$PROPS_URL" --out "out/$MATCH_ID.mp4"

      - name: Publish reel to the actual public root
        working-directory: .
        env:
          MATCH_ID: ${{ inputs.match_id }}
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}
          CPANEL_PUBLIC_ROOT: ${{ secrets.CPANEL_PUBLIC_ROOT }}
        run: bash scripts/ci/deploy-ssh.sh upload-reel
