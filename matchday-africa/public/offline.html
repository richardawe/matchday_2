<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<meta name="robots" content="noindex">
<title>Offline · Matchday Africa</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: #0b0b0b; color: #f7f1e3; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 22rem; }
  .tile { display: inline-grid; place-items: center; width: 72px; height: 72px; background: #ffd23f; padding: 7px; margin-bottom: 20px; }
  .tile span { display: grid; place-items: center; width: 100%; height: 100%; background: #0b0b0b; color: #ffd23f; font: 900 26px/1 Impact, "Anton", sans-serif; letter-spacing: .02em; }
  h1 { margin: 0 0 8px; font-size: 1.6rem; line-height: 1.15; }
  p { margin: 0 0 22px; color: #c9c2b2; }
  button { font: inherit; font-weight: 700; padding: 12px 22px; border: 0; background: #ffd23f; color: #0b0b0b; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="tile"><span>MD</span></div>
  <h1>No signal on the touchline</h1>
  <p>You're offline. Scores, reels and the Griot's stories will be back as soon as your connection is.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
